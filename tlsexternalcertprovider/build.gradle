apply plugin: 'com.android.application'

repositories {
    jcenter()
    maven { url "https://jitpack.io" }
    maven { url 'https://maven.google.com' }
}

ext {
    bouncycastleVersion = '1.49'
}

android {
    compileSdkVersion 35


    defaultConfig {
        applicationId "com.roqos.externalcertprovider"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        //sourceCompatibility 1.7
        //targetCompatibility 1.7
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(8)
        }
    }

    // This is just a demo package, don't care about it being perfect
    lintOptions {
        abortOnError false
    }
    namespace 'com.roqos.externalcertprovider'

    buildFeatures {
        aidl = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation (
    //'org.bouncycastle:bcprov-jdk15on:'  + bouncycastleVersion,
    //'org.bouncycastle:bcprov-ext-jdk15on:' + bouncycastleVersion,
    //'org.bouncycastle:bcpkix-jdk15on:' + bouncycastleVersion,
    'org.bouncycastle:bcmail-jdk15on:' + bouncycastleVersion,
    //'org.bouncycastle:bcpg-jdk15on:' + bouncycastleVersion
    )
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'junit:junit:4.13.2'
}
